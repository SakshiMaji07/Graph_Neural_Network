# SGMH-SLAM Siamese GNN baseline configuration
# Dataset directories contain one folder per scene, with gt.npz, h1.npz-h5.npz,
# and metadata.json. Training and validation must contain disjoint scene IDs.

dataset:
  train_path: "data/processed/train"
  val_path: "data/processed/val"
  test_path: "data/processed/test"
  num_hypotheses: 5

model:
  input_dim: 8
  hidden_dim: 64
  embedding_dim: 64
  num_layers: 2
  conv_type: "sage"
  pooling: "mean"
  dropout: 0.0
  activation: "relu"
  comparison_features: false

similarity_mlp:
  hidden_dims: [64, 32]
  dropout: 0.0

similarity_target:
  sigma_translation: 1.0
  sigma_rotation: 1.0

training:
  epochs: 100
  batch_size: 32
  learning_rate: 1.0e-3
  weight_decay: 1.0e-4
  optimizer: "adam"
  scheduler: "cosine_annealing"   # or null / none if no scheduler is used
  early_stopping_patience: 10

loss:
  type: "mse"

reproducibility:
  seed: 42

hardware:
  device: "cuda"  # use "cpu" for CPU-only systems, or "cuda" when available

logging:
  checkpoint_dir: "checkpoints/baseline_siamese"
  experiment_name: "sgmh_siamese_baseline"
